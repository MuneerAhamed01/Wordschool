  </div>

  <section aria-live="polite" style="flex-grow: 1; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(24,35,27,0.08); min-height: 0">

      <div style="display: flex; align-items: center; gap: 12px; height: 100%">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4F5E53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v2M17 11a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3-2l1 1"></path></svg>
        <span style="font-size: 14px; line-height: 20px; color: #4F5E53">Tap a landmark on the map. Its name, height and PSC facts appear here.</span>

    </sc-if>
    <sc-if value="{{hasSel}}">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <span style="height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 700; display: flex; align-items: center; background: {{verdictBg}}; color: {{verdictFg}}">{{verdict}}</span>
        <span style="font-size: 12px; color: #4F5E53">{{selKind}}</span>

      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span style="font-size: 20px; font-weight: 900">{{selName}}</span>
        <span style="font-size: 15px; font-weight: 700; color: #3F6B2A; white-space: nowrap">{{selElev}}</span>

      </sc-if>
    </sc-if>
  </section>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>

var MARKS = [
  { id: 'anamudi', name: 'Anamudi', kind: 'Peak · Idukki district', elev: '2,695 m', peak: true, x: 444.6, y: 536,
    fact: 'Highest peak in South India, inside Eravikulam National Park near Munnar.' },
  { id: 'meesa', name: 'Meesapulimala', kind: 'Peak · Idukki district', elev: '2,640 m', peak: true, x: 463.4, y: 550,
    fact: 'Second-highest peak in the Western Ghats, a short distance east of Anamudi near Munnar.' },
  { id: 'gap', name: 'Palakkad Gap', kind: 'Mountain gap · Palakkad', elev: '30–40 km wide', peak: false, x: 397, y: 406,
    fact: 'The largest break in the Western Ghats, between the Nilgiri and Anamalai hills. It links Kerala with Coimbatore.' },
  { id: 'bodi', name: 'Bodinayakkanur Pass', kind: 'Mountain pass · Idukki', elev: 'Munnar ↔ Theni', peak: false, x: 485.6, y: 566,
    fact: 'A Ghat pass linking the Munnar hills with Bodinayakkanur in Tamil Nadu.' },
  { id: 'nelli', name: 'Nelliampathy Hills', kind: 'Hill range · Palakkad', elev: 'Hill station', peak: true, x: 372, y: 464,
    fact: 'Hill range south of the Palakkad Gap, known for tea, coffee and orange estates.' }
];
var TASKS = [
  { label: 'CHALLENGE 1 · DONE', text: 'Trace the Western Ghats along Kerala’s eastern edge', target: null },
  { label: 'CHALLENGE 2', text: 'Locate Anamudi, the highest peak in South India', target: 'anamudi' },
  { label: 'CHALLENGE 3', text: 'Find the widest gap in the Western Ghats', target: 'gap' },

  { label: 'CHALLENGE 5', text: 'Locate the second-highest peak of the Western Ghats', target: 'meesa' }
];
class Component extends DCLogic {
  st() {
    var s = this.state || {};
    return { step: s.step == null ? 1 : s.step, found: s.found || [], sel: s.sel || null, last: s.last || null, xp: s.xp == null ? 25 : s.xp };
  }
  tap(id) {
    var s = this.st();
    var task = TASKS[s.step];
    if (task && task.target === id) {
      var found = s.found.concat([id]);
      this.setState({ found: found, sel: id, last: 'right', step: s.step + 1, xp: s.xp + 20 });

      this.setState({ sel: id, last: s.found.indexOf(id) >= 0 ? 'known' : 'wrong' });
    }

      var isFound = s.found.indexOf(m.id) >= 0, isSel = s.sel === m.id;
      var px = (m.x - 300) * S, py = (m.y - 380) * S;
      return {
        tap: function () { self.tap(m.id); },
        aria: isFound || isSel ? m.name : 'Unknown landmark ' + (i + 1),
        left: (px - 22) + 'px', top: (py - 22) + 'px',
        bg: isFound ? '#1F7A44' : (isSel ? '#FFF1C7' : '#FFFFFF'),
        bd: isFound ? '#FFFFFF' : (isSel ? '#B07A00' : (m.peak ? '#4C7D3A' : '#8A5A2B')),
        fg: isFound ? '#FFFFFF' : (m.peak ? '#3F6B2A' : '#8A5A2B'),
        peak: m.peak, pass: !m.peak,
        showName: isFound || isSel, name: m.name,

    });

    else if (s.last === 'known') { verdict = 'Already found'; vb = '#DDF0E2'; vf = '#0B3A1D'; }
    var bars = TASKS.map(function (t, i) { return { c: i < s.step ? '#1F7A44' : (i === s.step ? '#B07A00' : '#E3EADF') }; });
    return {
      marks: marks, bars: bars,
      stepText: done ? 'All 5 challenges complete' : 'Challenge ' + (s.step + 1) + ' of 5',
      xpText: '+' + s.xp + ' XP',
      taskLabel: done ? 'COMPLETE' : task.label, taskText: done ? 'You explored every landmark on this map' : task.text,
      noSel: !sel, hasSel: !!sel, allDone: done,
      verdict: verdict, verdictBg: vb, verdictFg: vf,
      selName: sel ? sel.name : '', selKind: sel ? sel.kind : '', selElev: sel ? sel.elev : '', selFact: sel ? sel.fact : ''
    };
  }
}
</script>
