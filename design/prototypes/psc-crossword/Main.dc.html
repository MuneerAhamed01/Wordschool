<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PSC Crossword home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+Malayalam:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6AAA64}a:hover{color:#8BC285}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121213; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px 0 16px; box-sizing: border-box; overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #538D4E; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 7px; box-sizing: border-box">
          <div style="background: #FFFFFF; border-radius: 2px"></div>
          <div style="background: rgba(255,255,255,0.35); border-radius: 2px"></div>
          <div style="background: rgba(255,255,255,0.35); border-radius: 2px"></div>
          <div style="background: #FFFFFF; border-radius: 2px"></div>
        </div>
        <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em">WordSchool <span style="color: #818384; font-weight: 500">PSC</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button aria-label="Switch language to Malayalam" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #3A3A3C; background: #1A1A1B; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px">EN <span style="color: #818384">/</span> <span style="font-family: 'Noto Sans Malayalam', sans-serif; color: #A9A9AB">മല</span></button>
        <div style="height: 32px; padding: 0 10px; border-radius: 16px; background: #2A1E16; color: #F5793A; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5793A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 1.5 2 2.5 2C11.5 7.5 11 5 12 3z"></path></svg>
          12
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em">PSC Crossword</h1>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #9A9B9C">Revise Kerala PSC facts, one grid at a time.</p>
    </div>

    <div style="background: #1A1A1B; border: 1px solid #3A3A3C; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #6AAA64">
            <span style="width: 6px; height: 6px; border-radius: 3px; background: #6AAA64"></span>
            DAILY · 22 OCT
          </div>
          <div style="font-size: 20px; line-height: 26px; font-weight: 700">Kerala Renaissance</div>
          <div style="font-size: 13px; color: #9A9B9C">7 clues · 8×8 grid · about 6 min</div>
        </div>
        <div style="width: 64px; height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px" aria-hidden="true">
          <div style="background: #538D4E; border-radius: 3px"></div><div style="background: #538D4E; border-radius: 3px"></div><div style="background: #538D4E; border-radius: 3px"></div><div style="background: #2A2A2C; border-radius: 3px"></div>
          <div style="background: #538D4E; border-radius: 3px"></div><div style="background: #121213; border-radius: 3px"></div><div style="background: #B59F3B; border-radius: 3px"></div><div style="background: #121213; border-radius: 3px"></div>
          <div style="background: #3A3A3C; border-radius: 3px"></div><div style="background: #3A3A3C; border-radius: 3px"></div><div style="background: #B59F3B; border-radius: 3px"></div><div style="background: #3A3A3C; border-radius: 3px"></div>
          <div style="background: #3A3A3C; border-radius: 3px"></div><div style="background: #121213; border-radius: 3px"></div><div style="background: #3A3A3C; border-radius: 3px"></div><div style="background: #121213; border-radius: 3px"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="Puzzle.dc.html" style="flex-grow: 1; height: 48px; border-radius: 12px; background: #538D4E; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
          Start puzzle
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
        <div style="font-size: 12px; line-height: 16px; color: #9A9B9C; text-align: right">+50 XP<br>on solve</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">Categories</h2>
        <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">See all</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <a href="Puzzle.dc.html" style="background: #1A1A1B; border: 1px solid #2E2E30; border-radius: 16px; padding: 12px; text-decoration: none; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px; min-height: 104px; box-sizing: border-box">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <div style="width: 36px; height: 36px; border-radius: 10px; background: #252526; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.tint}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
              </div>
              <span style="font-size: 11px; font-weight: 600; color: #9A9B9C">{{c.count}}</span>
            </div>
            <div style="font-size: 14px; line-height: 18px; font-weight: 600">{{c.name}}</div>
            <div style="height: 4px; border-radius: 2px; background: #2E2E30; overflow: hidden">
              <div style="height: 4px; border-radius: 2px; background: {{c.tint}}; width: {{c.pct}}"></div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <nav style="height: 76px; flex-shrink: 0; border-top: 1px solid #2E2E30; background: #161617; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 10px; box-sizing: border-box">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #FFFFFF; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6AAA64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
      Play
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #9A9B9C; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9B9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5zM4 19a2 2 0 0 1 2-2h12M9 7h6M9 11h4"></path></svg>
      Revise
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #9A9B9C; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9B9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path></svg>
      Ranks
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #9A9B9C; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9B9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>
      Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { name: 'Kerala History', count: '18 / 42', pct: '43%', tint: '#6AAA64', icon: 'M3 21h18M5 21V10M19 21V10M9 21v-6h6v6M2 10l10-6 10 6' },
        { name: 'Indian History', count: '9 / 60', pct: '15%', tint: '#C9B458', icon: 'M8 3h10a2 2 0 0 1 2 2v12M8 3a2 2 0 0 0-2 2v14a2 2 0 0 1-2 2h12a2 2 0 0 0 2-2V7M10 8h6M10 12h6' },
        { name: 'Constitution', count: '5 / 36', pct: '14%', tint: '#85C0F9', icon: 'M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7M19 7l-3 7a3 3 0 0 0 6 0l-3-7' },
        { name: 'Geography', count: '22 / 48', pct: '46%', tint: '#F5793A', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18' },
        { name: 'Science', count: 'New · 54', pct: '0%', tint: '#B79CED', icon: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 15h9' },
        { name: 'My mistakes', count: '14 words', pct: '60%', tint: '#E8E8E8', icon: 'M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4' }
      ]
    };
  }
}
</script>
</body>
</html>
