<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzle results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6AAA64}a:hover{color:#8BC285}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121213; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 14px 16px 24px 16px; gap: 18px">

  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <a href="Main.dc.html" aria-label="Close and go home" style="width: 44px; height: 44px; border-radius: 22px; background: #1A1A1B; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <button aria-label="Share result" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3A3A3C; background: #1A1A1B; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5h14v-5"></path></svg>
      Share
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 16px">
    <div style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 24px; background: #538D4E; display: flex; align-items: center; justify-content: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; color: #A9A9AB">Kerala History · Puzzle 12</div>
      <h1 style="margin: 0; font-size: 26px; line-height: 30px; font-weight: 800; letter-spacing: -0.02em">Puzzle solved</h1>
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 30px; font-weight: 800; color: #9FD39A; font-variant-numeric: tabular-nums">860</span>
        <span style="font-size: 13px; color: #A9A9AB">points</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <div style="background: #1A1A1B; border: 1px solid #2E2E30; border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">06:12</div>
      <div style="font-size: 11px; color: #A9A9AB">Time</div>
    </div>
    <div style="background: #1A1A1B; border: 1px solid #2E2E30; border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="font-size: 18px; font-weight: 800">5<span style="color: #818384; font-weight: 600">/7</span></div>
      <div style="font-size: 11px; color: #A9A9AB">Correct</div>
    </div>
    <div style="background: #1A1A1B; border: 1px solid #2E2E30; border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="font-size: 18px; font-weight: 800; color: #E5D27A">+45</div>
      <div style="font-size: 11px; color: #A9A9AB">XP</div>
    </div>
    <div style="background: #1A1A1B; border: 1px solid #2E2E30; border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="font-size: 18px; font-weight: 800; color: #F5793A">13</div>
      <div style="font-size: 11px; color: #A9A9AB">Day streak</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A9A9AB">
      <span><span style="color: #FFFFFF; font-weight: 700">Level 7</span> · Fact Finder</span>
      <span style="font-variant-numeric: tabular-nums">1,285 / 1,500 XP</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #2E2E30; overflow: hidden">
      <div style="height: 6px; width: 86%; border-radius: 3px; background: #C9B458"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Mistakes to revise</h2>
      <span style="font-size: 12px; color: #A9A9AB">Saved to My mistakes</span>
    </div>

    <sc-for list="{{mistakes}}" as="m" hint-placeholder-count="2">
      <article style="background: #1A1A1B; border: 1px solid #2E2E30; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <div style="display: flex; gap: 3px" aria-label="{{m.answer}}">
            <sc-for list="{{m.letters}}" as="l">
              <span style="width: 26px; height: 30px; border-radius: 4px; background: #538D4E; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{l.ch}}</span>
            </sc-for>
          </div>
          <span style="font-size: 11px; font-weight: 700; border-radius: 10px; padding: 4px 8px; white-space: nowrap; color: {{m.tagFg}}; background: {{m.tagBg}}">{{m.tag}}</span>
        </div>
        <div style="font-size: 12px; color: #A9A9AB">{{m.clueRef}}</div>
        <div style="font-size: 13px; line-height: 19px; color: #E8E8E8">{{m.fact}}</div>
      </article>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="#" style="height: 50px; border-radius: 12px; background: #538D4E; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5zM4 19a2 2 0 0 1 2-2h12"></path></svg>
      Revise 2 mistakes
    </a>
    <a href="Puzzle.dc.html" style="height: 50px; border-radius: 12px; border: 1px solid #3A3A3C; background: #1A1A1B; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-sizing: border-box">Next puzzle</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
function letters(w) { return w.split('').map(function (ch) { return { ch: ch }; }); }
class Component extends DCLogic {
  renderVals() {
    return {
      mistakes: [
        {
          answer: 'VAIKOM', letters: letters('VAIKOM'),
          tag: 'You typed VAIKAM', tagFg: '#F2B8AE', tagBg: '#3A1F1B',
          clueRef: '2 Down · 1924–25 satyagraha for temple road entry',
          fact: 'The Vaikom Satyagraha in Travancore protested the ban on oppressed castes using roads around the Vaikom temple.'
        },
        {
          answer: 'KAPPAD', letters: letters('KAPPAD'),
          tag: 'Revealed', tagFg: '#E5D27A', tagBg: '#3A3524',
          clueRef: '5 Across · Where Vasco da Gama landed in 1498',
          fact: 'Kappad beach near Kozhikode is where Vasco da Gama reached the Malabar coast in May 1498.'
        }
      ]
    };
  }
}
</script>
</body>
</html>
