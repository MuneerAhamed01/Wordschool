  dictionaryx: ^0.3.5
  # firebase_auth: ^4.16.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  permission_handler: ^12.0.1
  dio: ^5.7.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_bloc: ^7.0.0
  flutter_dotenv: ^5.2.1
