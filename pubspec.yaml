  in_app_purchase: ^3.2.1
  flutter_animate: ^4.5.2
  just_audio: ^0.9.46
  audio_session: ^0.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  firebase_core_platform_interface: ^6.0.0
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.3.0
  freezed: ^2.5.8
  build_runner: ^2.4.14
  json_serializable: ^6.9.3
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  flutter_gen_core:
    git:
      url: https://github.com/FlutterGen/flutter_gen.git
      path: packages/core/

flutter_gen:
  output: lib/core/assets/


flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - .env
    - .env.dev
    - .env.prod
    - assets/words/words.txt
    - assets/words/answers.txt
    - assets/legal/
    - assets/audio/

